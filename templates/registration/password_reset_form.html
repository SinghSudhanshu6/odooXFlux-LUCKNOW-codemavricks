{% extends "base.html" %}
{% block title %}Reset your password{% endblock %}
{% block body %}<div class="layer min-h-screen grid place-items-center p-6"><div class="glass panel authbox">
<h1 class="text-2xl font-bold mb-2">Reset your password</h1><p class="muted mb-5">Enter your account email and we will send a single-use link.</p>
<form method="post" class="grid gap-4">{% csrf_token %}{% for f in form %}<div><label class="label" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% for e in f.errors %}<div class="err">{{ e }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Send reset link</button></form>
</div></div>{% endblock %}
